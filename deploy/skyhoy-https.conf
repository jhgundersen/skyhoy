server {
    listen 80;
    server_name skyhoy.jonh.no;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://skyhoy.jonh.no$request_uri; }
}
server {
    listen 443 ssl;
    server_name skyhoy.jonh.no;
    root /www/skyhoy;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/skyhoy.jonh.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skyhoy.jonh.no/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / { try_files $uri $uri/ =404; }
    # Filenames are stable, so browsers must revalidate after each release.
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
}
