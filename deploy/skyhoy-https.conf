server {
    listen 80;
    server_name skyhoy.jonh.no;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://skyhoy.jonh.no$request_uri; }
}
server {
    listen 443 ssl;
    server_name skyhoy.jonh.no;
    root /www/skyhoy;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/skyhoy.jonh.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skyhoy.jonh.no/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Docker DNS is resolved per request, so nginx also starts if the leaderboard is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /server/ { return 404; }
    location /api/ {
        set $skyhoy_backend http://skyhoy-leaderboard:8082;
        proxy_pass $skyhoy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
        client_max_body_size 4k;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { try_files $uri $uri/ =404; }
    # Filenames are stable, so browsers must revalidate after each release.
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
}
